<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тестування ЄДКІ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --surface: #f7f9fc;
      --text: #141c24;
      --muted: #617182;
      --accent: #1366d6;
      --accent-hover: #0e4fa8;
      --accent-soft: #eaf2fd;
      --border: #dfe6ef;
      --ok-bg: #e8f7ed;
      --ok-border: #239947;
      --ok-text: #14632c;
      --bad-bg: #fdeceb;
      --bad-border: #d93829;
      --bad-text: #9e1b10;
      --neutral-bg: #eef2f7;
      --neutral-border: #c9d4e3;
      --neutral-text: #3b4a5a;
      --shadow: 0 10px 30px rgba(15, 28, 46, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at top, #f7faff 0%, var(--bg) 65%);
      color: var(--text);
      line-height: 1.55;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .topbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 15px;
    }

    .stats-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
    }

    .stat-pill strong {
      color: var(--text);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-pill.timer-warn {
      background: var(--bad-bg);
      border-color: #f4c7c3;
      color: var(--bad-text);
    }

    .stat-pill.timer-warn strong { color: var(--bad-text); }

    .progress-wrap {
      width: 100%;
      height: 7px;
      background: #e6ecf3;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1366d6, #388bfd);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 26px;
      box-shadow: var(--shadow);
    }

    .question-text {
      font-size: 19px;
      font-weight: 600;
      margin: 0 0 22px;
      color: var(--text);
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      font-size: 15.5px;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.correct {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-text);
      font-weight: 600;
    }

    .option-btn.wrong {
      background: var(--bad-bg);
      border-color: var(--bad-border);
      color: var(--bad-text);
    }

    .feedback {
      margin-top: 20px;
      padding: 13px 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      display: none;
    }

    .feedback.ok {
      display: block;
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-border);
    }

    .feedback.bad {
      display: block;
      background: var(--bad-bg);
      color: var(--bad-text);
      border: 1px solid var(--bad-border);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #eef2f6;
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button.primary:hover:not(:disabled) { background: var(--accent-hover); }

    button.primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    button.secondary:hover {
      color: var(--text);
      border-color: #c7d2e0;
      background: #eff3f8;
    }

    button.danger {
      background: var(--bad-bg);
      color: var(--bad-text);
      border: 1px solid #f4c7c3;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button.danger:hover { background: #fbd9d6; }

    .badge-pass, .badge-fail, .badge-partial {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
    }

    .badge-pass {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-border);
    }

    .badge-fail {
      background: var(--bad-bg);
      color: var(--bad-text);
      border: 1px solid var(--bad-border);
    }

    .badge-partial {
      background: var(--neutral-bg);
      color: var(--neutral-text);
      border: 1px solid var(--neutral-border);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin: 22px 0;
    }

    .summary-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
    }

    .summary-box span {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .summary-box strong {
      font-size: 24px;
      color: var(--text);
    }

    .profile-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin: 16px 0 12px;
    }

    .profile-input {
      width: 100%;
      padding: 11px 14px;
      font-size: 15px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .profile-input:focus {
      border-color: var(--accent);
      background: #ffffff;
    }

    .profile-input[readonly] {
      background: #eef2f7;
      color: var(--muted);
    }

    .sync-note {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .history-meta {
      font-size: 13px;
      color: var(--muted);
    }

    .history-score {
      font-weight: 700;
      font-size: 15px;
    }

    .empty-state {
      color: var(--muted);
      font-size: 14px;
      padding: 18px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .card {
        padding: 20px 16px;
        border-radius: 18px;
      }
      .question-text { font-size: 17px; }
      .actions {
        flex-direction: column-reverse;
        align-items: stretch;
      }
      button.primary, button.secondary, button.danger {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="topbar-row">
        <div class="stats-group">
          <div class="stat-pill">Питання: <strong id="qCounter">0 / 0</strong></div>
          <div class="stat-pill">Бали: <strong id="scoreCounter">0 / 0</strong></div>
          <div class="stat-pill" id="timerPill">Час: <strong id="timerCounter">02:30:00</strong></div>
        </div>
        <button class="secondary" id="openProfileBtn" type="button">Профіль: <span id="topProfileName">Студент</span></button>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="card" id="quizCard">
      <p class="question-text" id="questionText">Завантаження...</p>
      <div class="options" id="optionsBox"></div>
      <div class="feedback" id="feedbackBox"></div>
      <div class="actions">
        <button class="secondary" id="finishEarlyBtn" type="button">Завершити спробу</button>
        <button class="primary" id="nextBtn" type="button" disabled>Наступне питання</button>
      </div>
    </div>

    <div class="card" id="resultCard" style="display: none;">
      <div id="statusBadge"></div>
      <h2 style="margin: 14px 0 6px; font-size: 22px;">Результат тестування</h2>
      <p style="color: var(--muted); margin: 0;" id="summaryNote"></p>

      <div class="summary-grid">
        <div class="summary-box">
          <span>Бали</span>
          <strong id="finalScore">0 / 0</strong>
        </div>
        <div class="summary-box">
          <span>Відсоток</span>
          <strong id="finalPercent">0%</strong>
        </div>
      </div>

      <div class="actions" style="border-top: none; padding-top: 0; margin-top: 8px; justify-content: flex-start;">
        <button class="primary" id="startNewRunBtn" type="button">Нова спроба</button>
        <button class="secondary" id="resultToProfileBtn" type="button">Відкрити профіль</button>
      </div>
    </div>

    <div class="card" id="profileCard" style="display: none;">
      <h2 style="margin: 0 0 6px; font-size: 22px;">Профіль Telegram</h2>
      <p style="color: var(--muted); margin: 0;">Дані закріплюються за вашим Telegram-профілем на бекенді.</p>

      <form class="profile-form" id="profileForm">
        <input
          class="profile-input"
          id="tgKeyInput"
          type="text"
          maxlength="64"
          placeholder="Ключ профілю (наприклад, tg_123456789)"
        />
        <input
          class="profile-input"
          id="profileNameInput"
          type="text"
          maxlength="40"
          placeholder="Ім'я або підпис"
        />
        <button class="primary" type="submit">Зберегти та синхронізувати</button>
      </form>
      <div class="sync-note" id="syncStatusText">Синхронізація: підключення...</div>

      <div class="summary-grid">
        <div class="summary-box">
          <span>Спроб пройдено</span>
          <strong id="profileTotalAttempts">0</strong>
        </div>
        <div class="summary-box">
          <span>Найкращий результат</span>
          <strong id="profileBestPercent">0%</strong>
        </div>
        <div class="summary-box">
          <span>Середній відсоток</span>
          <strong id="profileAvgPercent">0%</strong>
        </div>
      </div>

      <h3 style="margin: 20px 0 8px; font-size: 17px;">Історія спроб</h3>
      <div class="history-list" id="historyList"></div>

      <div class="actions">
        <button class="danger" id="clearHistoryBtn" type="button">Очистити історію</button>
        <button class="primary" id="backToQuizBtn" type="button">Повернутися до тесту</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://edki-quiz.onrender.com";
    const QUESTIONS_PER_RUN = 150;
    const PASS_PERCENTAGE = 42;
    const DURATION_MS = 2.5 * 60 * 60 * 1000;
    const CACHE_PREFIX = "edki_tg_state_v1_";
    const LAST_KEY_STORAGE = "edki_tg_last_key_v1";

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    function getTelegramUser() {
      const tgUser = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe
        ? window.Telegram.WebApp.initDataUnsafe.user
        : null;
      return tgUser && tgUser.id ? tgUser : null;
    }

    function detectProfileKey() {
      const tgUser = getTelegramUser();
      if (tgUser) {
        return `tg_${tgUser.id}`;
      }
      try {
        const saved = localStorage.getItem(LAST_KEY_STORAGE);
        if (saved && saved.trim()) return saved.trim();
      } catch {}
      return "tg_guest";
    }

    function detectDefaultName() {
      const tgUser = getTelegramUser();
      if (!tgUser) return "Студент";
      return [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ").trim() || tgUser.username || "Студент";
    }

    function shuffleArray(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeQuestion(question) {
      const opts = Array.isArray(question.options) ? question.options.filter(Boolean) : [];
      let rawCorrect = Number(question.correctIndex);
      if (!Number.isInteger(rawCorrect) || rawCorrect < 0 || rawCorrect >= opts.length) {
        rawCorrect = 0;
      }

      const indexed = opts.map((text, idx) => ({ text, isCorrect: idx === rawCorrect }));
      const shuffled = shuffleArray(indexed);
      const shuffledCorrectIdx = shuffled.findIndex((item) => item.isCorrect);

      return {
        id: question.id,
        question: String(question.question || "").trim(),
        options: shuffled.map((item) => item.text),
        correctIndex: shuffledCorrectIdx >= 0 ? shuffledCorrectIdx : 0,
      };
    }

    class QuestionPool {
      constructor(allQuestions, initialUsedIds = []) {
        this.allQuestions = allQuestions;
        const validIds = new Set(allQuestions.map((q) => q.id));
        this.usedIds = Array.isArray(initialUsedIds)
          ? initialUsedIds.filter((id) => validIds.has(id))
          : [];
      }

      nextAttempt(count = QUESTIONS_PER_RUN) {
        const targetCount = Math.min(count, this.allQuestions.length);
        const usedSet = new Set(this.usedIds);
        const available = shuffleArray(this.allQuestions.filter((q) => !usedSet.has(q.id)));

        let picked = [];
        if (available.length >= targetCount) {
          picked = available.slice(0, targetCount);
          this.usedIds.push(...picked.map((q) => q.id));
        } else {
          picked = [...available];
          const needed = targetCount - picked.length;
          const pickedIds = new Set(picked.map((q) => q.id));
          const nextCycle = shuffleArray(this.allQuestions.filter((q) => !pickedIds.has(q.id)));
          const extra = nextCycle.slice(0, needed);
          picked.push(...extra);
          this.usedIds = extra.map((q) => q.id);
        }

        return picked.map(normalizeQuestion);
      }
    }

    let profileKey = detectProfileKey();
    let profile = { name: detectDefaultName(), history: [] };
    let pool = null;
    let attemptQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let answeredCount = 0;
    let currentSelection = null;
    let remainingMs = DURATION_MS;
    let lastTickMs = null;
    let timerInterval = null;
    let attemptSaved = false;
    let previousView = "quizCard";
    let syncTimer = null;

    const qCounterEl = document.getElementById("qCounter");
    const scoreCounterEl = document.getElementById("scoreCounter");
    const timerPillEl = document.getElementById("timerPill");
    const timerCounterEl = document.getElementById("timerCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionTextEl = document.getElementById("questionText");
    const optionsBoxEl = document.getElementById("optionsBox");
    const feedbackBoxEl = document.getElementById("feedbackBox");
    const nextBtnEl = document.getElementById("nextBtn");
    const finishEarlyBtnEl = document.getElementById("finishEarlyBtn");
    const startNewRunBtnEl = document.getElementById("startNewRunBtn");
    const quizCardEl = document.getElementById("quizCard");
    const resultCardEl = document.getElementById("resultCard");
    const profileCardEl = document.getElementById("profileCard");
    const summaryNoteEl = document.getElementById("summaryNote");
    const openProfileBtnEl = document.getElementById("openProfileBtn");
    const topProfileNameEl = document.getElementById("topProfileName");
    const resultToProfileBtnEl = document.getElementById("resultToProfileBtn");
    const backToQuizBtnEl = document.getElementById("backToQuizBtn");
    const profileFormEl = document.getElementById("profileForm");
    const tgKeyInputEl = document.getElementById("tgKeyInput");
    const profileNameInputEl = document.getElementById("profileNameInput");
    const clearHistoryBtnEl = document.getElementById("clearHistoryBtn");
    const syncStatusTextEl = document.getElementById("syncStatusText");

    function buildSessionSnapshot() {
      if (attemptSaved || attemptQuestions.length === 0) return null;
      return {
        attemptQuestions,
        currentIdx,
        score,
        answeredCount,
        currentSelection,
        remainingMs: Math.max(0, Math.round(remainingMs)),
      };
    }

    function buildStateSnapshot() {
      return {
        name: profile.name,
        history: profile.history,
        usedIds: pool ? pool.usedIds : [],
        activeSession: buildSessionSnapshot(),
      };
    }

    function saveLocal(key, snapshot) {
      try {
        localStorage.setItem(LAST_KEY_STORAGE, key);
        localStorage.setItem(`${CACHE_PREFIX}${key}`, JSON.stringify(snapshot));
      } catch {}
    }

    function loadLocal(key) {
      try {
        const raw = localStorage.getItem(`${CACHE_PREFIX}${key}`);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    async function pushToBackend(key, snapshot) {
      try {
        const res = await fetch(`${API_BASE_URL}/api/state/${encodeURIComponent(key)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(snapshot),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        syncStatusTextEl.textContent = `Закріплено за профілем ${key} (синхронізовано)`;
      } catch {
        syncStatusTextEl.textContent = `Збережено локально для ${key} (перевірте зв'язок із бекендом)`;
      }
    }

    function syncProgress(immediate = false) {
      const snapshot = buildStateSnapshot();
      saveLocal(profileKey, snapshot);

      if (immediate) {
        if (syncTimer) clearTimeout(syncTimer);
        pushToBackend(profileKey, snapshot);
        return;
      }

      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        pushToBackend(profileKey, buildStateSnapshot());
      }, 250);
    }

    async function fetchQuestions() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/questions`, { cache: "no-store" });
        if (!res.ok) throw new Error("API questions failed");
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) return data;
      } catch {}

      const fallbackRes = await fetch("questions.json", { cache: "no-store" });
      if (!fallbackRes.ok) throw new Error("Не вдалося завантажити базу питань");
      const fallbackData = await fallbackRes.json();
      if (!Array.isArray(fallbackData) || fallbackData.length === 0) {
        throw new Error("База питань порожня");
      }
      return fallbackData;
    }

    async function fetchStateFromBackend(key) {
      try {
        const res = await fetch(`${API_BASE_URL}/api/state/${encodeURIComponent(key)}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const remote = await res.json();
        saveLocal(key, remote);
        syncStatusTextEl.textContent = `Завантажено профіль ${key} із сервера`;
        return remote;
      } catch {
        const cached = loadLocal(key);
        syncStatusTextEl.textContent = cached
          ? `Використано локальний кеш для ${key}`
          : `Новий профіль ${key} (очікування бекенда)`;
        return cached || { name: detectDefaultName(), history: [], usedIds: [], activeSession: null };
      }
    }

    function formatRemainingTime(ms) {
      const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    function renderTimer() {
      timerCounterEl.textContent = formatRemainingTime(remainingMs);
      if (remainingMs <= 10 * 60 * 1000) {
        timerPillEl.classList.add("timer-warn");
      } else {
        timerPillEl.classList.remove("timer-warn");
      }
    }

    function stepTimer() {
      if (attemptSaved || attemptQuestions.length === 0) return;
      const now = Date.now();
      if (lastTickMs !== null && !document.hidden) {
        const elapsed = Math.max(0, now - lastTickMs);
        remainingMs = Math.max(0, remainingMs - elapsed);
      }
      lastTickMs = now;
      renderTimer();
      saveLocal(profileKey, buildStateSnapshot());

      if (remainingMs <= 0) {
        stopTimer();
        showSummary("time_up");
      }
    }

    function startTimer() {
      stopTimer();
      lastTickMs = Date.now();
      renderTimer();
      timerInterval = setInterval(stepTimer, 1000);
    }

    function stopTimer() {
      if (!attemptSaved && attemptQuestions.length > 0 && lastTickMs !== null && !document.hidden) {
        const now = Date.now();
        remainingMs = Math.max(0, remainingMs - Math.max(0, now - lastTickMs));
        syncProgress(true);
      }
      if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      lastTickMs = null;
    }

    function formatDate(isoStr) {
      try {
        const d = new Date(isoStr);
        return d.toLocaleString("uk-UA", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      } catch {
        return "";
      }
    }

    function renderProfileView() {
      const isTg = Boolean(getTelegramUser());
      topProfileNameEl.textContent = profile.name;
      tgKeyInputEl.value = profileKey;
      tgKeyInputEl.readOnly = isTg;
      profileNameInputEl.value = profile.name;

      const totalAttempts = profile.history.length;
      const bestPercent = totalAttempts > 0
        ? Math.max(...profile.history.map((item) => Number(item.percentage) || 0))
        : 0;
      const avgPercent = totalAttempts > 0
        ? Number((profile.history.reduce((acc, item) => acc + (Number(item.percentage) || 0), 0) / totalAttempts).toFixed(1))
        : 0;

      document.getElementById("profileTotalAttempts").textContent = String(totalAttempts);
      document.getElementById("profileBestPercent").textContent = `${bestPercent}%`;
      document.getElementById("profileAvgPercent").textContent = `${avgPercent}%`;

      const historyListEl = document.getElementById("historyList");
      historyListEl.innerHTML = "";

      if (totalAttempts === 0) {
        historyListEl.innerHTML = '<div class="empty-state">Поки що немає збережених спроб. Завершіть тест, щоб побачити результат тут.</div>';
        return;
      }

      profile.history.forEach((entry) => {
        const row = document.createElement("div");
        row.className = "history-item";

        const left = document.createElement("div");
        const modeLabel = entry.fullRun ? "Повна спроба (150)" : `Неповна спроба (${entry.answeredCount} питань)`;
        left.innerHTML = `
          <div class="history-score">${entry.score} / ${entry.denominator} (${entry.percentage}%)</div>
          <div class="history-meta">${modeLabel} · ${formatDate(entry.date)}</div>
        `;

        const badge = document.createElement("span");
        if (entry.fullRun) {
          badge.className = entry.passed ? "badge-pass" : "badge-fail";
          badge.textContent = entry.passed ? "Складено" : "Не складено";
        } else {
          badge.className = "badge-partial";
          badge.textContent = "Неповна спроба";
        }

        row.appendChild(left);
        row.appendChild(badge);
        historyListEl.appendChild(row);
      });
    }

    function openProfile() {
      stopTimer();
      previousView = resultCardEl.style.display !== "none" ? "resultCard" : "quizCard";
      quizCardEl.style.display = "none";
      resultCardEl.style.display = "none";
      profileCardEl.style.display = "block";
      renderProfileView();
    }

    function closeProfile() {
      profileCardEl.style.display = "none";
      if (previousView === "resultCard") {
        resultCardEl.style.display = "block";
      } else {
        quizCardEl.style.display = "block";
        if (!attemptSaved && attemptQuestions.length > 0) {
          startTimer();
        }
      }
    }

    function updateTopBar() {
      const total = attemptQuestions.length;
      const shownNum = total > 0 ? Math.min(currentIdx + 1, total) : 0;
      qCounterEl.textContent = `${shownNum} / ${total}`;
      scoreCounterEl.textContent = `${score} / ${total}`;
      topProfileNameEl.textContent = profile.name;
      const progressPercent = total > 0 ? (answeredCount / total) * 100 : 0;
      progressBarEl.style.width = `${progressPercent}%`;
    }

    function applyFeedbackState(q) {
      const allButtons = optionsBoxEl.querySelectorAll(".option-btn");
      if (!currentSelection) {
        feedbackBoxEl.className = "feedback";
        feedbackBoxEl.textContent = "";
        nextBtnEl.disabled = true;
        return;
      }

      allButtons.forEach((b) => { b.disabled = true; });

      const { selectedIdx, isCorrect } = currentSelection;
      if (isCorrect) {
        if (allButtons[selectedIdx]) allButtons[selectedIdx].classList.add("correct");
        feedbackBoxEl.className = "feedback ok";
        feedbackBoxEl.textContent = "Правильно";
      } else {
        if (allButtons[selectedIdx]) allButtons[selectedIdx].classList.add("wrong");
        if (allButtons[q.correctIndex]) allButtons[q.correctIndex].classList.add("correct");
        feedbackBoxEl.className = "feedback bad";
        feedbackBoxEl.textContent = `Неправильно. Правильна відповідь: ${q.options[q.correctIndex]}`;
      }

      nextBtnEl.disabled = false;
    }

    function renderQuestion() {
      const q = attemptQuestions[currentIdx];
      if (!q) {
        showSummary("completed");
        return;
      }

      nextBtnEl.textContent = currentIdx === attemptQuestions.length - 1 ? "Завершити тест" : "Наступне питання";
      questionTextEl.textContent = q.question;
      optionsBoxEl.innerHTML = "";

      q.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = optText;
        btn.addEventListener("click", () => handleAnswer(idx));
        optionsBoxEl.appendChild(btn);
      });

      applyFeedbackState(q);
      updateTopBar();
    }

    function handleAnswer(selectedIdx) {
      if (currentSelection || attemptSaved) return;
      const q = attemptQuestions[currentIdx];
      const isCorrect = selectedIdx === q.correctIndex;

      answeredCount += 1;
      if (isCorrect) score += 1;
      currentSelection = { selectedIdx, isCorrect };

      applyFeedbackState(q);
      updateTopBar();
      syncProgress();
    }

    function showSummary(reason = "manual") {
      stopTimer();
      quizCardEl.style.display = "none";
      profileCardEl.style.display = "none";
      resultCardEl.style.display = "block";

      const fullRunTotal = attemptQuestions.length;
      const completedFullRun = fullRunTotal > 0 && answeredCount >= fullRunTotal;
      const denominator = completedFullRun ? fullRunTotal : Math.max(1, answeredCount);

      const percentage = answeredCount > 0 ? Number(((score / denominator) * 100).toFixed(1)) : 0;
      const passed = completedFullRun ? percentage >= PASS_PERCENTAGE : null;

      const badgeEl = document.getElementById("statusBadge");
      if (completedFullRun) {
        badgeEl.className = passed ? "badge-pass" : "badge-fail";
        badgeEl.textContent = passed ? "Складено" : "Не складено";
        summaryNoteEl.textContent = `Пройдено всі ${fullRunTotal} питань · прохідний поріг ${PASS_PERCENTAGE}%.`;
      } else {
        badgeEl.className = "badge-partial";
        badgeEl.textContent = "Неповна спроба";
        summaryNoteEl.textContent = reason === "time_up"
          ? `Час вичерпано. Пройдено ${answeredCount} із ${fullRunTotal} питань. Статус складання виставляється лише за повний тест на ${fullRunTotal} питань.`
          : `Пройдено ${answeredCount} із ${fullRunTotal} питань. Статус складання виставляється лише за повний тест на ${fullRunTotal} питань.`;
      }

      document.getElementById("finalScore").textContent = answeredCount > 0
        ? `${score} / ${denominator}`
        : `0 / 0`;
      document.getElementById("finalPercent").textContent = `${percentage}%`;

      if (!attemptSaved && answeredCount > 0) {
        attemptSaved = true;
        profile.history.unshift({
          date: new Date().toISOString(),
          score,
          denominator,
          answeredCount,
          percentage,
          passed,
          fullRun: completedFullRun,
        });
      }

      attemptQuestions = [];
      syncProgress(true);
    }

    function startAttempt() {
      if (!pool) return;
      attemptQuestions = pool.nextAttempt(QUESTIONS_PER_RUN);
      currentIdx = 0;
      score = 0;
      answeredCount = 0;
      currentSelection = null;
      attemptSaved = false;
      remainingMs = DURATION_MS;
      progressBarEl.style.width = "0%";

      profileCardEl.style.display = "none";
      resultCardEl.style.display = "none";
      quizCardEl.style.display = "block";

      syncProgress(true);
      startTimer();
      renderQuestion();
    }

    function resumeAttempt(savedSession) {
      attemptQuestions = savedSession.attemptQuestions;
      currentIdx = Math.min(Math.max(0, Number(savedSession.currentIdx) || 0), attemptQuestions.length - 1);
      score = Number(savedSession.score) || 0;
      answeredCount = Number(savedSession.answeredCount) || 0;
      currentSelection = savedSession.currentSelection || null;
      remainingMs = Math.max(0, Number(savedSession.remainingMs) || DURATION_MS);
      attemptSaved = false;

      if (remainingMs <= 0) {
        showSummary("time_up");
        return;
      }

      profileCardEl.style.display = "none";
      resultCardEl.style.display = "none";
      quizCardEl.style.display = "block";

      startTimer();
      renderQuestion();
    }

    async function loadProfileIntoApp(key, overrideName = null) {
      const allQuestions = pool ? pool.allQuestions : await fetchQuestions();
      const remote = await fetchStateFromBackend(key);

      profileKey = key;
      profile = {
        name: overrideName || (typeof remote.name === "string" && remote.name.trim() ? remote.name.trim() : detectDefaultName()),
        history: Array.isArray(remote.history) ? remote.history : [],
      };
      pool = new QuestionPool(allQuestions, remote.usedIds || []);
      topProfileNameEl.textContent = profile.name;

      const active = remote.activeSession;
      if (active && Array.isArray(active.attemptQuestions) && active.attemptQuestions.length > 0) {
        previousView = "quizCard";
        resumeAttempt(active);
      } else {
        startAttempt();
      }
    }

    nextBtnEl.addEventListener("click", () => {
      if (!currentSelection) return;
      if (currentIdx + 1 >= attemptQuestions.length) {
        showSummary("completed");
        return;
      }
      currentIdx += 1;
      currentSelection = null;
      syncProgress();
      renderQuestion();
    });

    finishEarlyBtnEl.addEventListener("click", () => showSummary("manual"));
    startNewRunBtnEl.addEventListener("click", startAttempt);
    openProfileBtnEl.addEventListener("click", openProfile);
    resultToProfileBtnEl.addEventListener("click", openProfile);
    backToQuizBtnEl.addEventListener("click", closeProfile);

    profileFormEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const isTg = Boolean(getTelegramUser());
      const nextKey = isTg ? profileKey : (tgKeyInputEl.value.trim() || "tg_guest");
      const nextName = profileNameInputEl.value.trim() || detectDefaultName();

      if (nextKey !== profileKey) {
        stopTimer();
        await loadProfileIntoApp(nextKey, nextName);
        syncProgress(true);
        renderProfileView();
      } else {
        profile.name = nextName;
        topProfileNameEl.textContent = profile.name;
        syncProgress(true);
        renderProfileView();
      }
    });

    clearHistoryBtnEl.addEventListener("click", () => {
      profile.history = [];
      syncProgress(true);
      renderProfileView();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopTimer();
      } else if (!attemptSaved && attemptQuestions.length > 0 && profileCardEl.style.display === "none") {
        startTimer();
      }
    });

    window.addEventListener("pagehide", stopTimer);
    window.addEventListener("beforeunload", stopTimer);

    async function init() {
      try {
        const allQuestions = await fetchQuestions();
        pool = new QuestionPool(allQuestions, []);
        await loadProfileIntoApp(profileKey);
      } catch (err) {
        questionTextEl.textContent = `Помилка: ${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
